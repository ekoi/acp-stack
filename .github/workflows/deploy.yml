name: Deploy

on:
  push:
    branches: [master, main]
    paths-ignore:
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-acp-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ACP Stack on Mac mini
    runs-on: [self-hosted, macOS, X64, acp-stack]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Bootstrap secrets
        run: |
          chmod +x docker/scripts/bootstrap-secrets.sh
          docker/scripts/bootstrap-secrets.sh acp docker/../automated-curation-platform/conf
          docker/scripts/bootstrap-secrets.sh aca docker/../acp-config-assistant/conf
          docker/scripts/bootstrap-secrets.sh mts docker/../metadata-transformation-service/conf

      - name: Deploy full stack
        run: |
          cd docker
          docker compose -f docker-compose-full-stack.yaml up -d --build

      - name: Verify core services
        run: |
          cd docker
          docker compose -f docker-compose-full-stack.yaml ps

