version: 1

manifest:
  url: git@github.com:Dans-labs/acp-stack.git

repos:
  automated-curation-platform:
    url: git@github.com:Dans-labs/automated-curation-platform.git
    path: ./automated-curation-platform
    default_branch: master

  metadata-transformation-service:
    url: git@github.com:Dans-labs/metadata-transformation-service.git
    path: ./metadata-transformation-service
    default_branch: master

  acp-config-assistant:
    url: git@github.com:Dans-labs/acp-config-assistant.git
    path: ./acp-config-assistant
    default_branch: master

settings:
  pr_prefix: "[acp-stack]"
  merge_strategy: all-or-nothing
